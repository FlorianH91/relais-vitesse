<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Relais EPS</title>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5);
            --inner-shadow: inset 6px 6px 12px #c1c9d7, inset -6px -6px 12px #ffffff;
            --accent-blue: #007bff;
            --text-dark: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: var(--text-dark);
        }

        .container {
            text-align: center;
            padding: 40px;
            border-radius: 30px;
            background: var(--bg-color);
            box-shadow: var(--shadow);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-weight: 400;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .selection-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .menu-card {
            padding: 30px;
            border-radius: 20px;
            background: var(--bg-color);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid transparent;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
        }

        .menu-card:active {
            box-shadow: var(--inner-shadow);
            transform: translateY(0);
        }

        .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .description {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Relais EPS Expert</h1>
        
        <div class="selection-grid">
            <a href="relais_2x50.html" class="menu-card">
                <div class="icon">🏃🏃</div>
                <div class="title">Relais 2 x 50m</div>
                <div class="description">Vitesse et transmission en binôme</div>
            </a>

            <a href="relais_4x50.html" class="menu-card">
                <div class="icon">🏃🏃🏃🏃</div>
                <div class="title">Relais 4 x 50m</div>
                <div class="description">Stratégie complète et 3 transmissions</div>
            </a>

 <a href="Observation_relais.html" class="menu-card">
                <div class="icon">👁️🏃🏃</div>
                <div class="title">Observation Relais</div>
                <div class="description">Fiche d'observation Relais-vitesse</div>
            </a>


        </div>

        <div class="footer">
            Sélectionnez le format de l'épreuve pour commencer
        </div>
    </div>

</body>
</html>
