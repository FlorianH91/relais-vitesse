<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relais 4x50m</title>
    <script src="https://cdn.jsdelivr.net/npm/gaugeJS/dist/gauge.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --bg-color: #e0e5ec;
            --shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5);
            --inner-shadow: inset 6px 6px 12px #c1c9d7, inset -6px -6px 12px #ffffff;
            --track-color: #d35400;
            --accent-blue: #007bff;
            --text-dark: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            display: flex; flex-direction: column; align-items: center;
            padding: 10px; margin: 0; color: #444;
        }

        .header-container { width: 95%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        .settings-btn { 
            background: var(--accent-blue); color: white; border: none; 
            border-radius: 50%; width: 45px; height: 45px; cursor: pointer; font-size: 1.4rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #settingsModal, #detailModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--bg-color); padding: 25px; border-radius: 20px;
            width: 95%; max-width: 1000px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow);
        }
        
        .cat-check { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent-blue); vertical-align: middle; margin-right: 5px; }
        .category-item { background: #fff; padding: 8px 15px; border-radius: 10px; border: 2px solid transparent; transition: 0.2s; }
        .category-item:has(.cat-check:checked) { border-color: var(--accent-blue); }

        .settings-grid { display: flex; flex-direction: column; gap: 20px; }
        .bareme-table-container { overflow-x: auto; margin-top: 10px; border-radius: 10px; box-shadow: var(--inner-shadow); background: #fff; padding: 10px; }
        .bareme-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .bareme-table th { background: #f8f9fa; padding: 8px; border: 1px solid #dee2e6; }
        .bareme-table td { padding: 5px; border: 1px solid #dee2e6; text-align: center; }
        .bareme-table input { width: 45px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 0.75rem; }

        .step-controls { display: flex; align-items: center; gap: 15px; margin: 10px 0; }
        .btn-step { width: 35px; height: 35px; border-radius: 8px; border: none; background: #2c3e50; color: white; cursor: pointer; font-weight: bold; font-size: 1.2rem; }
        .magic-btn { background: #6f42c1; color: white; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 0.9rem; }

        .setup-relay { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 15px; width: 95%; max-width: 800px; }
        .runners-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .runner-input { display: flex; flex-direction: column; gap: 4px; padding: 8px; background: rgba(255,255,255,0.2); border-radius: 15px; }
        
        input, select { padding: 8px; border-radius: 10px; border: none; background: var(--bg-color); box-shadow: var(--inner-shadow); font-size: 0.8rem; outline: none; text-align: center; }
        input[type="number"] { width: 60px; }
        .name-in { width: 90px; }

        #chrono { font-family: 'Courier New', monospace; font-size: 3.5rem; font-weight: bold; padding: 15px 25px; background: var(--bg-color); box-shadow: var(--shadow); border-radius: 20px; margin: 15px 0; color: var(--text-dark); }
        .track-container { width: 90%; max-width: 600px; margin: 20px 0 60px 0; position: relative; }
        .track { height: 45px; background: var(--track-color); border: 3px solid #fff; border-radius: 10px; position: relative; }
        .runner { width: 22px; height: 22px; background: #fff; border: 3px solid #333; border-radius: 50%; position: absolute; top: 9px; left: 0%; transform: translateX(-50%); transition: left 0.3s linear; z-index: 10; }
        .plot { position: absolute; bottom: -22px; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 15px solid #333; transform: translateX(-50%); }
        .plot-label { position: absolute; bottom: -38px; transform: translateX(-50%); font-size: 0.65rem; font-weight: bold; color: #666; }
        .track-marker { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.5); transform: translateX(-50%); }

        #mainActionBtn { width: 100px; height: 100px; border-radius: 50%; border: none; background: var(--bg-color); box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; outline: none; }
        .btn-text { font-weight: bold; color: var(--accent-blue); font-size: 0.8rem; margin-top: 5px; }

        .controls { margin: 20px 0; display: flex; gap: 15px; }
        button.secondary { padding: 10px 20px; border-radius: 12px; border: none; background: var(--bg-color); box-shadow: var(--shadow); cursor: pointer; font-weight: bold; color: #666; font-size: 0.85rem; }

        #resultsArea { margin-top: 10px; padding: 20px; border-radius: 20px; background: var(--bg-color); box-shadow: var(--inner-shadow); display: none; width: 95%; max-width: 600px; }
        .gauges-container { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 15px; }
        .gauge-box { width: 140px; text-align: center; font-size: 0.75rem; }

        .history-container { width: 100%; max-width: 1000px; margin-top: 25px; padding: 15px; background: var(--bg-color); box-shadow: var(--shadow); border-radius: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; min-width: 900px; }
        th { border-bottom: 2px solid #ccc; padding: 10px; color: #444; background: rgba(255,255,255,0.3); }
        td { padding: 10px; text-align: center; border-bottom: 1px solid #ddd; }
        .clickable-cell { cursor: pointer; text-decoration: underline; color: var(--accent-blue); font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 10px; color: white; font-weight: bold; font-size: 0.7rem; display: inline-block; }

        .schematic-box { width: 100%; max-width: 600px; background: #fff; border-radius: 15px; padding: 20px; margin: 0 auto; box-shadow: var(--inner-shadow); }
        .schematic-track { height: 60px; background: #d35400; position: relative; border-radius: 8px; margin: 40px 0; border: 2px solid #fff; }
        .schematic-zone { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; color: white; border-right: 1px dashed rgba(255,255,255,0.5); }
        .zone-label-top { position: absolute; top: -30px; width: 100%; text-align: center; color: #666; font-size: 0.75rem; }
        
        .runner-icon { font-size: 24px; position: absolute; top: 15px; display: inline-block; transform: scaleX(-1); }
    </style>
</head>
<body>

    <div class="header-container">
        <h2 style="font-weight: 400; margin: 0; color: var(--text-dark);">Relais 4x50m</h2>
        <div style="display:flex; gap:10px;">
            <button class="secondary" onclick="clearAllData()" style="color:red; font-size: 0.7rem;">Réinitialiser Tout</button>
            <button class="settings-btn" onclick="toggleSettings()" title="Paramètres du barème">⚙️</button>
        </div>
    </div>

    <div id="settingsModal">
        <div class="modal-content">
            <h3 style="margin-top:0">Paramètres du Barème</h3>
            <div class="settings-grid">
                <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center;">
                    <div>
                        <label>Note Maximale : </label>
                        <input type="number" id="maxNoteInput" value="6" step="1" onchange="updateNoteIntervals()" style="width: 70px;">
                    </div>
                    <div class="step-controls">
                        <label>Paliers : </label>
                        <button class="btn-step" onclick="changeStepCount(-1)">-</button>
                        <b id="stepCountDisplay">25</b>
                        <button class="btn-step" onclick="changeStepCount(1)">+</button>
                    </div>
                </div>
                <div id="categoryToggles" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
                <div class="bareme-table-container">
                    <table class="bareme-table" id="baremeEditableTable">
                        <thead><tr id="tableHeaderRow"></tr></thead>
                        <tbody id="tableBodyRows"></tbody>
                    </table>
                </div>
            </div>
            <div style="margin-top: 25px; display: flex; gap: 15px; justify-content: flex-end;">
                <button class="secondary" onclick="toggleSettings()">Annuler</button>
                <button class="secondary" onclick="saveSettings()" style="background: var(--accent-blue); color: white;">Appliquer</button>
            </div>
        </div>
    </div>

    <div id="detailModal">
        <div class="modal-content" style="max-width: 700px; text-align: center;">
            <h3 id="detailTitle">Analyse Transmission</h3>
            <div class="schematic-box" id="schematicContainer"></div>
            <div style="margin-top: 20px;">
                <button class="secondary" onclick="document.getElementById('detailModal').style.display='none'">Fermer</button>
            </div>
        </div>
    </div>

    <div class="setup-relay">
        <div class="runners-list" id="runnersInputs">
            <div class="runner-input">
                <input type="text" class="name-in" value="A">
                <select class="genre-in"><option value="F">F</option><option value="G" selected>G</option></select>
                <input type="number" class="time-ref" value="8.00" step="0.1">
            </div>
            <div class="runner-input">
                <input type="text" class="name-in" value="B">
                <select class="genre-in"><option value="F">F</option><option value="G" selected>G</option></select>
                <input type="number" class="time-ref" value="8.00" step="0.1">
            </div>
            <div class="runner-input">
                <input type="text" class="name-in" value="C">
                <select class="genre-in"><option value="F" selected>F</option><option value="G">G</option></select>
                <input type="number" class="time-ref" value="8.00" step="0.1">
            </div>
            <div class="runner-input">
                <input type="text" class="name-in" value="D">
                <select class="genre-in"><option value="F" selected>F</option><option value="G">G</option></select>
                <input type="number" class="time-ref" value="8.00" step="0.1">
            </div>
        </div>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap: wrap; justify-content: center;">
            <button class="secondary" onclick="addRunnerField()">+ Élève</button>
            <span style="font-size:0.8rem">Course :</span>
            <select id="courseSelect" style="width: 100px;"></select>
            <input type="text" id="customCourseIn" placeholder="Ex: ABCE" style="width: 70px; text-transform: uppercase;">
            <button class="secondary" onclick="addCustomCourse()" title="Ajouter cette composition">+</button>
        </div>
    </div>
    
    <div id="chrono">00.00</div>

    <div class="track-container">
        <div class="track" id="mainTrack"><div class="runner" id="runner"></div></div>
    </div>

    <button id="mainActionBtn">
        <span style="font-size: 1.5rem;">⏱️</span>
        <div class="btn-text" id="btnLabel">DÉPART</div>
    </button>

    <div class="controls">
        <button class="secondary" onclick="resetApp()">Nouvel Essai</button>
        <button class="secondary" style="background:var(--accent-blue); color:white;" onclick="exportToPDF()">PDF</button>
        <button class="secondary" style="background:#28a745; color:white;" onclick="exportToCSV()">CSV</button>
    </div>

    <div id="resultsArea">
        <h3 style="text-align:center; margin-top:0;">Efficacité des Transmissions</h3>
        <div class="gauges-container" id="gaugesRow"></div>
    </div>

    <div class="history-container">
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Essai</th>
                    <th>Composition</th>
                    <th>Temps Réel</th>
                    <th>T1 (%)</th>
                    <th>T2 (%)</th>
                    <th>T3 (%)</th>
                    <th>Maîtrise</th>
                    <th>Diff. Théo</th>
                    <th id="noteHeader" style="background:rgba(0, 123, 255, 0.1)">Note /6</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

<script>
    let startTime = 0, timer, clicks = 0, times = [], trialCount = 0;
    const pts = [0, 20, 40, 60, 70, 80, 90, 110, 120, 130, 140, 160, 180, 200];

    let config = {
        maxNote: 6,
        categories: [
            { id: 0, label: "Filles (4F)", active: true, times: [38.8, 38.7, 38.3, 37.9, 37.5, 37.2, 36.8, 36.5, 36.1, 35.8, 35.4, 35.1, 34.7, 34.4, 34.0, 33.7, 33.3, 33.0, 32.6, 32.3, 32.0, 31.7, 31.4, 31.1, 30.8] },
            { id: 1, label: "Mixte (3F/1G)", active: true, times: [37.0, 36.9, 36.5, 36.2, 35.7, 35.4, 35.1, 34.8, 34.5, 34.2, 33.9, 33.6, 33.2, 33.0, 32.6, 32.3, 32.0, 31.7, 31.3, 31.0, 30.7, 30.4, 30.1, 29.8, 29.5] },
            { id: 2, label: "Mixte (2F/2G)", active: true, times: [35.2, 35.1, 34.8, 34.5, 33.9, 33.6, 33.3, 33.1, 32.9, 32.6, 32.3, 32.1, 31.8, 31.5, 31.2, 31.0, 30.7, 30.4, 30.0, 29.7, 29.4, 29.1, 28.8, 28.5, 28.1] },
            { id: 3, label: "Mixte (1F/3G)", active: true, times: [33.3, 33.2, 33.0, 32.7, 32.1, 31.8, 31.6, 31.3, 31.2, 31.0, 30.8, 30.5, 30.3, 30.1, 29.8, 29.6, 29.3, 29.0, 28.7, 28.4, 28.1, 27.8, 27.5, 27.1, 26.8] },
            { id: 4, label: "Garçons (4G)", active: true, times: [31.5, 31.4, 31.2, 31.0, 30.8, 30.6, 30.4, 30.2, 30.0, 29.8, 29.6, 29.4, 29.2, 29.0, 28.8, 28.6, 28.4, 28.2, 28.0, 27.7, 27.4, 27.1, 26.8, 26.5, 26.4] }
        ],
        notes: []
    };

    // --- FONCTIONS LOCALSTORAGE ---
    function saveAppData() {
        const historyHtml = document.getElementById('historyBody').innerHTML;
        const runnersData = [];
        document.querySelectorAll('.runner-input').forEach(div => {
            runnersData.push({
                name: div.querySelector('.name-in').value,
                genre: div.querySelector('.genre-in').value,
                time: div.querySelector('.time-ref').value
            });
        });
        
        const data = {
            config: config,
            trialCount: trialCount,
            historyHtml: historyHtml,
            runners: runnersData
        };
        localStorage.setItem('relaisExpertData', JSON.stringify(data));
    }

    function loadAppData() {
        const saved = localStorage.getItem('relaisExpertData');
        if (!saved) return;
        const data = JSON.parse(saved);
        
        config = data.config;
        trialCount = data.trialCount;
        document.getElementById('historyBody').innerHTML = data.historyHtml;
        document.getElementById('maxNoteInput').value = config.maxNote;
        document.getElementById('noteHeader').textContent = `Note /${config.maxNote}`;

        if (data.runners && data.runners.length > 0) {
            const container = document.getElementById('runnersInputs');
            container.innerHTML = '';
            data.runners.forEach(r => {
                const div = document.createElement('div');
                div.className = 'runner-input';
                div.innerHTML = `<input type="text" class="name-in" value="${r.name}"><select class="genre-in"><option value="F" ${r.genre==='F'?'selected':''}>F</option><option value="G" ${r.genre==='G'?'selected':''}>G</option></select><input type="number" class="time-ref" value="${r.time}" step="0.1">`;
                container.appendChild(div);
            });
        }
        updateCourseOptions();
    }

    function clearAllData() {
        if(confirm("Supprimer définitivement l'historique et les réglages ?")) {
            localStorage.removeItem('relaisExpertData');
            location.reload();
        }
    }

    function updateNoteIntervals() {
        const max = parseFloat(document.getElementById('maxNoteInput').value);
        const steps = config.categories[0].times.length;
        config.notes = Array.from({length: steps}, (_, i) => parseFloat(((i * max) / (steps - 1)).toFixed(2)));
        renderSettingsTable();
    }

    function distributeLinear(catId) {
        const inputs = document.querySelectorAll(`input[data-cat="${catId}"]`);
        const startVal = parseFloat(inputs[0].value);
        const endVal = parseFloat(inputs[inputs.length - 1].value);
        const steps = inputs.length;
        for (let i = 1; i < steps - 1; i++) {
            const val = startVal + (endVal - startVal) * (i / (steps - 1));
            inputs[i].value = val.toFixed(1);
        }
    }

    function changeStepCount(delta) {
        const currentSteps = config.categories[0].times.length;
        const newSteps = currentSteps + delta;
        if (newSteps < 2 || newSteps > 50) return;
        config.categories.forEach(cat => {
            if (delta > 0) cat.times.push(cat.times[cat.times.length - 1]);
            else cat.times.pop();
        });
        document.getElementById('stepCountDisplay').textContent = newSteps;
        updateNoteIntervals();
    }

    function toggleSettings() {
        const modal = document.getElementById('settingsModal');
        modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        if (modal.style.display === 'flex') {
            document.getElementById('stepCountDisplay').textContent = config.categories[0].times.length;
            renderSettingsTable();
        }
    }

    function renderSettingsTable() {
        const header = document.getElementById('tableHeaderRow');
        const body = document.getElementById('tableBodyRows');
        const toggles = document.getElementById('categoryToggles');
        header.innerHTML = '<th>Catégorie</th>' + config.notes.map(n => `<th>${n}</th>`).join('') + '<th>🪄</th>';
        toggles.innerHTML = config.categories.map(c => `
            <div class="category-item">
                <input type="checkbox" class="cat-check" data-id="${c.id}" ${c.active ? 'checked' : ''}> 
                <span style="font-weight:bold">${c.label}</span>
            </div>
        `).join('');
        body.innerHTML = config.categories.map(c => `
            <tr style="display: ${c.active ? 'table-row' : 'none'}">
                <td style="font-weight:bold; white-space:nowrap; background:#f0f0f0;">${c.label}</td>
                ${c.times.map((t, i) => `<td><input type="number" step="0.1" value="${t}" data-cat="${c.id}" data-idx="${i}" ${i === c.times.length - 1 ? `onchange="distributeLinear(${c.id})"` : ''}></td>`).join('')}
                <td><button class="magic-btn" onclick="distributeLinear(${c.id})" title="Lisser la ligne">🪄</button></td>
            </tr>
        `).join('');
    }

    function saveSettings() {
        config.maxNote = parseFloat(document.getElementById('maxNoteInput').value);
        document.getElementById('noteHeader').textContent = `Note /${config.maxNote}`;
        document.querySelectorAll('.cat-check').forEach(cb => { config.categories[parseInt(cb.dataset.id)].active = cb.checked; });
        document.querySelectorAll('#tableBodyRows input').forEach(input => {
            const cat = parseInt(input.dataset.cat);
            const idx = parseInt(input.dataset.idx);
            config.categories[cat].times[idx] = parseFloat(input.value);
        });
        saveAppData();
        toggleSettings();
    }

    function addCustomCourse() {
        const input = document.getElementById('customCourseIn');
        const val = input.value.toUpperCase().trim();
        const runnerCount = document.getElementById('runnersInputs').children.length;
        const maxLetter = String.fromCharCode(64 + runnerCount);
        if (val.length !== 4) { alert("La course doit comporter exactement 4 lettres (ex: ABCE)."); return; }
        const regex = new RegExp(`^[A-${maxLetter}]{4}$`);
        if (!regex.test(val)) { alert(`Utilisez uniquement les lettres de A à ${maxLetter}.`); return; }
        const select = document.getElementById('courseSelect');
        const option = document.createElement('option');
        option.value = val; option.textContent = val;
        select.appendChild(option); select.value = val; input.value = "";
        saveAppData();
    }

    const btn = document.getElementById('mainActionBtn');
    const btnLabel = document.getElementById('btnLabel');
    const runner = document.getElementById('runner');
    const chronoDisp = document.getElementById('chrono');
    const track = document.getElementById('mainTrack');
    const courseSelect = document.getElementById('courseSelect');

    function addRunnerField() {
        const container = document.getElementById('runnersInputs');
        if (container.children.length < 6) {
            const letter = String.fromCharCode(65 + container.children.length);
            const div = document.createElement('div');
            div.className = 'runner-input';
            div.innerHTML = `<input type="text" class="name-in" value="${letter}"><select class="genre-in"><option value="F">F</option><option value="G">G</option></select><input type="number" class="time-ref" value="8.00" step="0.1">`;
            container.appendChild(div);
            updateCourseOptions();
            saveAppData();
        }
    }

    function updateCourseOptions() {
        const count = document.getElementById('runnersInputs').children.length;
        let options = (count === 4) ? ["ABCD", "BADC"] : (count === 5) ? ["ABCD", "BADE", "AEDC"] : ["ABCD", "BAEF", "DCFE"];
        courseSelect.innerHTML = options.map(o => `<option value="${o}">${o}</option>`).join('');
    }

    function drawPlots() {
        const maxDist = pts[pts.length - 1];
        const yellowPlots = [40, 60, 90, 110, 140, 160];
        pts.forEach((pt, idx) => {
            const pos = (pt / maxDist) * 100;
            if (yellowPlots.includes(pt)) {
                const marker = document.createElement('div'); marker.className = 'track-marker'; marker.style.left = pos + '%'; track.appendChild(marker);
            }
            const plot = document.createElement('div'); plot.className = 'plot'; plot.style.left = pos + '%';
            if (yellowPlots.includes(pt)) plot.style.borderBottomColor = '#f1c40f';
            else if (idx === 0 || idx === pts.length - 1) plot.style.borderBottomColor = '#27ae60';
            else plot.style.borderBottomColor = '#e74c3c';
            track.appendChild(plot);
            const label = document.createElement('div'); label.className = 'plot-label'; label.style.left = pos + '%'; label.textContent = pt + 'm'; track.appendChild(label);
        });
    }

    btn.addEventListener('click', () => {
        clicks++;
        if (clicks === 1) {
            startTime = Date.now();
            timer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const d = new Date(elapsed);
                chronoDisp.textContent = d.getUTCSeconds().toString().padStart(2, '0') + "." + Math.floor(d.getUTCMilliseconds()/10).toString().padStart(2, '0');
            }, 10);
        } else {
            times.push((Date.now() - startTime) / 1000);
            runner.style.left = (pts[clicks-1] / pts[pts.length-1] * 100) + "%";
        }
        if (clicks === pts.length) { clearInterval(timer); processResults(); btnLabel.textContent = "FIN"; btn.disabled = true; } 
        else { btnLabel.textContent = `${pts[clicks]}m`; }
    });

    function getV(tEnd, tStart, dist) { return (dist / (tEnd - tStart)) * 3.6; }

    function processResults() {
        document.getElementById('resultsArea').style.display = 'block';
        const row = document.getElementById('gaugesRow'); row.innerHTML = '';
        const v1 = { d: getV(times[1], times[0], 20), e: getV(times[2], times[1], 20), r: getV(times[4], times[2], 20) };
        const v2 = { d: getV(times[5], times[3], 20), e: getV(times[6], times[5], 20), r: getV(times[8], times[6], 20) };
        const v3 = { d: getV(times[9], times[7], 20), e: getV(times[10], times[9], 20), r: getV(times[11], times[10], 20) };
        const effs = [ Math.round(v1.e / ((v1.d + v1.r) / 2) * 100), Math.round(v2.e / ((v2.d + v2.r) / 2) * 100), Math.round(v3.e / ((v3.d + v3.r) / 2) * 100) ];
        effs.forEach((e, i) => createGauge(row, `Trans. ${i+1}`, e));
        saveToHistory(effs, [v1, v2, v3]);
    }

    function createGauge(container, label, value) {
        const div = document.createElement('div'); div.className = 'gauge-box';
        const id = `g${Math.random().toString(16).slice(2)}`;
        div.innerHTML = `<canvas id="${id}" width="140" height="80"></canvas><br><b>${label}</b><br>${value}%`;
        container.appendChild(div);
        const g = new Gauge(document.getElementById(id)).setOptions({
            angle: 0.15, lineWidth: 0.4,
            staticZones: [{strokeStyle: "#e74c3c", min: 0, max: 70}, {strokeStyle: "#f1c40f", min: 70, max: 90}, {strokeStyle: "#2ecc71", min: 90, max: 110}, {strokeStyle: "#1e8449", min: 110, max: 150}]
        });
        g.maxValue = 150; g.set(value);
    }

    function calculateNote(temps, nbFilles) {
        let lineIdx = nbFilles === 4 ? 0 : nbFilles === 3 ? 1 : nbFilles === 2 ? 2 : nbFilles === 1 ? 3 : 4;
        let cat = config.categories[lineIdx];
        if (!cat.active) return "-";
        let line = cat.times;
        let noteAttribuee = 0;
        for (let i = 0; i < line.length; i++) {
            if (temps <= line[i]) noteAttribuee = config.notes[i];
            else break;
        }
        return noteAttribuee;
    }

    function saveToHistory(res, vDetails) {
        trialCount++;
        const totalReal = parseFloat(chronoDisp.textContent);
        const composition = courseSelect.value;
        const inputs = document.querySelectorAll('.runner-input');
        const dataMap = {};
        inputs.forEach((input, i) => {
            const letter = String.fromCharCode(65 + i);
            dataMap[letter] = { name: input.querySelector('.name-in').value, genre: input.querySelector('.genre-in').value, time: parseFloat(input.querySelector('.time-ref').value) || 0 };
        });
        const selectedRunners = composition.split('').map(l => dataMap[l]);
        const nbFilles = selectedRunners.filter(r => r.genre === 'F').length;
        const totalTheo = selectedRunners.reduce((sum, r) => sum + r.time, 0);
        const diff = (totalReal - totalTheo).toFixed(2);
        const note = calculateNote(totalReal, nbFilles);
        const avgEff = Math.round(res.reduce((a,b)=>a+b)/3);
        let mCol = avgEff < 70 ? "#e74c3c" : avgEff < 90 ? "#f1c40f" : avgEff <= 110 ? "#2ecc71" : "#1e8449";
        
        const body = document.getElementById('historyBody');
        const tr = document.createElement('tr');
        const vDataStr = JSON.stringify(vDetails);

        tr.innerHTML = `
            <td>${trialCount}</td>
            <td>${selectedRunners.map(r=>r.name).join('>')} (${nbFilles}F)</td>
            <td style="font-weight:bold">${totalReal}s</td>
            <td class="clickable-cell" onclick='showTransmissionDetail(1, ${vDataStr})'>${res[0]}%</td>
            <td class="clickable-cell" onclick='showTransmissionDetail(2, ${vDataStr})'>${res[1]}%</td>
            <td class="clickable-cell" onclick='showTransmissionDetail(3, ${vDataStr})'>${res[2]}%</td>
            <td><span class="badge" style="background:${mCol}">${avgEff}%</span></td>
            <td style="color:${diff <= 0 ? '#27ae60' : '#e74c3c'}">${diff}s</td>
            <td style="font-weight:bold; font-size:1.1rem; color:var(--text-dark)">${note}</td>
        `;
        body.prepend(tr);
        saveAppData();
    }

    function showTransmissionDetail(tNum, vDetails) {
        const modal = document.getElementById('detailModal');
        const container = document.getElementById('schematicContainer');
        const title = document.getElementById('detailTitle');
        const v = vDetails[tNum-1];
        title.innerText = `Analyse Transmission n°${tNum}`;
        let start, trans, end;
        if(tNum === 1) { start="20-40m"; trans="40-60m"; end="60-80m"; }
        else if(tNum === 2) { start="70-90m"; trans="90-110m"; end="110-130m"; }
        else { start="120-140m"; trans="140-160m"; end="160-180m"; }

        container.innerHTML = `
            <div style="display:flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.85rem;">
                <div style="color:#27ae60"><b>Donneur</b><br>${v.d.toFixed(1)} km/h</div>
                <div style="color:#d35400"><b>Zone Transmission</b><br>${v.e.toFixed(1)} km/h</div>
                <div style="color:#2980b9"><b>Receveur</b><br>${v.r.toFixed(1)} km/h</div>
            </div>
            <div class="schematic-track">
                <div class="schematic-zone" style="left:0; width:33%; background:rgba(39, 174, 96, 0.3);">
                    <div class="zone-label-top">${start}</div>
                </div>
                <div class="schematic-zone" style="left:33%; width:34%; background:rgba(211, 84, 0, 0.6);">
                    <div class="zone-label-top">${trans}</div>
                    <span class="runner-icon" style="left:10%">🏃</span>
                    <span style="font-size:20px; margin:0 5px; position:relative; top:5px;">🤝</span>
                    <span class="runner-icon" style="right:10%">🏃</span>
                </div>
                <div class="schematic-zone" style="left:67%; width:33%; background:rgba(41, 128, 185, 0.3);">
                    <div class="zone-label-top">${end}</div>
                </div>
            </div>
            <p style="font-size:0.8rem; color:#666; margin-top:10px;">L'efficacité est le rapport entre la vitesse en zone de transmission et la moyenne des vitesses d'entrée/sortie.</p>
        `;
        modal.style.display = 'flex';
    }

    function resetApp() {
        clicks = 0; times = []; startTime = 0; clearInterval(timer);
        chronoDisp.textContent = "00.00"; btnLabel.textContent = "DÉPART"; runner.style.left = "0%";
        document.getElementById('resultsArea').style.display = 'none'; btn.disabled = false;
    }

    function exportToPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4');
        doc.setFontSize(18); doc.setTextColor(44, 62, 80);
        doc.text("Rapport de Performance - Relais 4x50m Expert", 14, 15);
        doc.setFontSize(10); doc.setTextColor(100);
        doc.text(`Généré le : ${new Date().toLocaleString()}`, 14, 22);
        doc.autoTable({
            html: '#historyTable', startY: 30, theme: 'grid',
            headStyles: { fillColor: [0, 123, 255], halign: 'center' },
            bodyStyles: { halign: 'center' },
            columnStyles: { 1: { halign: 'left', cellWidth: 50 }, 8: { fillColor: [230, 240, 255], fontStyle: 'bold' } },
            didParseCell: function(data) {
                if (data.section === 'body' && data.column.index === 6) {
                    data.cell.text = [data.cell.raw.innerText || data.cell.raw.textContent];
                }
            }
        });
        doc.save(`relais_resultats.pdf`);
    }

    function exportToCSV() {
        const table = document.getElementById("historyTable");
        let csv = [];
        for (let i = 0; i < table.rows.length; i++) {
            let row = [], cols = table.rows[i].cells;
            for (let j = 0; j < cols.length; j++) {
                let data = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, "").replace(/;/g, ",");
                row.push('"' + data + '"');
            }
            csv.push(row.join(";"));
        }
        const csvContent = "data:text/csv;charset=utf-8," + csv.join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "relais_export.csv");
        link.click();
    }

    // --- EXECUTION INITIALE ---
    updateNoteIntervals();
    drawPlots();
    loadAppData(); // Charge les données sauvegardées au démarrage
</script>
</body>
</html>
